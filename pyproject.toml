[project]
name = "tactum-api"
version = "0.1.0"
description = "Backend API for the Tactum website: leads, Stripe deposits and reservations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    # Used by Stripe's async client (stripe.HTTPXClient).
    "httpx>=0.28",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "stripe>=12.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Only needed once, to copy the existing MongoDB data into PostgreSQL.
migration = [
    "pymongo>=4.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
